[project]
name = "gpt2small"
version = "0.1.0"
description = "basic interpretability for gpt2 small"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "ipykernel",
    "jupyterlab",
    "accelerate",
    "transformers",
    "matplotlib",
    "datasets",
    "tqdm",
]



[tool.uv]
index-url = "https://download.pytorch.org/whl/cu126"


[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"