<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" , content="width=device-width, initial-scale=1.0">
    <title>The Life of Shabbetai Zvi: A Historical Map</title>

    <!-- Leaflet CSS for the Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --parchment: #f4ecd8;
            --ink: #2c2c2c;
            --accent: #8b0000;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: var(--parchment);
            color: var(--ink);
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 350px;
            background-color: #eaddca;
            border-right: 2px solid #d4c4a8;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 5px 0 15px var(--shadow);
            z-index: 1000;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }

        .intro {
            font-style: italic;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Timeline Elements */
        .timeline-item {
            background: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            padding: 15px;
            border-left: 4px solid var(--accent);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .timeline-item:hover {
            transform: translateX(5px);
            background: white;
        }

        .timeline-date {
            font-weight: bold;
            display: block;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .timeline-title {
            font-size: 1.1rem;
            font-weight: bold;
            display: block;
        }

        .timeline-desc {
            font-size: 0.85rem;
            margin-top: 5px;
            line-height: 1.3;
        }

        /* Map Styling */
        #map {
            flex-grow: 1;
            height: 100%;
        }

        /* Legend/Footer */
        .footer {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            font-size: 0.7rem;
            border-radius: 3px;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            #container {
                flex-direction: column;
            }

            #sidebar {
                width: 100%;
                height: 40%;
            }

            #map {
                height: 60%;
            }
        }
    </style>
</head>

<body>

    <div id="container">
        <!-- Sidebar Timeline -->
        <div id="sidebar">
            <h1>Shabbetai Zvi</h1>
            <p class="intro">A chronological journey through the life of the 17th-century messianic figure.</p>

            <div id="timeline">
                <!-- Timeline items injected by JS -->
            </div>
        </div>

        <!-- Interactive Map -->
        <div id="map"></div>

        <div class="footer">Interactive Historical Atlas</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Historical Data
        const historyData = [
            {
                date: "c. 1626",
                title: "Smyrna (Izmir)",
                desc: "Birth and early life. Zvi grew up in a prominent Jewish community in the Ottoman Empire.",
                coords: [38.4237, 27.1428],
                info: "<b>Smyrna:</b> The beginning of his journey."
            },
            {
                date: "1665 - 1666",
                title: "Gaza",
                desc: "Meeting with Nathan of Gaza. The movement gains theological momentum and spreads rapidly.",
                coords: [31.5021, 34.4668],
                info: "<b>Gaza:</b> The center of the messianic prophecy."
            },
            {
                date: "1666",
                title: "Constantinople (Istanbul)",
                desc: "The turning point. Summoned by Ottoman authorities, Zvi converts to Islam to avoid execution.",
                coords: [41.0082, 28.9784],
                info: "<b>Constantinople:</b> The great crisis and conversion."
            },
            {
                date: "Post-1666",
                title: "The Diaspora Impact",
                desc: "The movement's influence spreads across Europe and North Africa, leaving a lasting mark on Jewish mysticism.",
                coords: [48.8566, 2.3522],
                info: "<b>Europe:</b> The spread of Sabbatean ideas."
            }
        ];

        // Initialize Map
        // Centering on the Ottoman Empire region
        const map = L.map('map').setView([38.0, 35.0], 4);

        // Use a "Stamen Terrain" style via CartoDB for a more 'historical' look
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        const timelineContainer = document.getElementById('timeline');
        const markers = [];

        // Populate Timeline and Map
        historyData.forEach((item, index) => {
            // 1. Add to Sidebar
            const div = document.createElement('div');
            div.className = 'timeline-item';
            div.innerHTML = `
            <span class="timeline-date">${item.date}</span>
            <span class="timeline-title">${item.title}</span>
            <p class="timeline-desc">${item.desc}</p>
        `;

            // Click event to fly to location
            div.onclick = () => {
                map.flyTo(item.coords, 6, {
                    animate: true,
                    duration: 1.5
                });
                // Open popup automatically
                markers[index].openPopup();
            };

            timelineContainer.appendChild(div);

            // 2. Add Marker to Map
            const marker = L.marker(item.coords).addTo(map);
            marker.bindPopup(`<b>${item.title}</b><br>${item.info}`);
            markers.push(marker);
        });

        // Add a special "Movement Scope" circle around the Mediterranean
        const circle = L.circle([35, 30], {
            color: '#8b0000',
            fillColor: '#8b0000',
            fillOpacity: 0.1,
            radius: 1500000
        }).addTo(map);

    </script>

</body>

</html>
